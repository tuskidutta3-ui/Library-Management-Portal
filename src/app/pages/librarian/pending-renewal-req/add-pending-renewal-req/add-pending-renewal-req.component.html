<div mat-dialog-title class="d-flex shadow-sm">
  <span>Approve/Reject Request</span>
  <span class="flex-grow-1 flex-shrink-1 flex-basis-auto"></span>
  <button mat-icon-button data-dismiss="modal" mat-dialog-close>
    <mat-icon>cancel</mat-icon>
  </button>
</div>
<div mat-dialog-content data-target="#modal" class="dialog-content">
  <form [formGroup]="editrequestBooksInfo" class="mat-form-field">
    <div class="row d-flex justify-content-center mt-3">
      <div class="col-md-3">
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="Approve"
            name="adminRenewReqStatus"
            value="A"
            formControlName="adminRenewReqStatus"
          />
          <label class="form-check-label" for="Approve">Approve</label>
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="Reject"
            name="adminRenewReqStatus"
            value="R"
            formControlName="adminRenewReqStatus"
          />
          <label class="form-check-label" for="Reject">Reject</label>
        </div>
      </div>
    </div>
    <div
      class="row mt-3 d-flex justify-content-center"
      *ngIf="showCancelRemarks"
    >
      <!-- <div class="col-md-6"> -->
      <!-- <div class="row"> -->
      <label class="form-label col-md-3">
        Rejection Remarks <span class="text-danger">*</span>
      </label>
      <div class="col-md-6">
        <textarea
          class="form-control"
          rows="2"
          placeholder="Enter cancellation Remarks"
          formControlName="adminRenewReqRemarks"
        ></textarea>
      </div>
      <!-- </div> -->
      <!-- </div> -->
    </div>
  </form>
  <app-loading></app-loading
  ><!-- spinner -->
</div>
<div mat-dialog-actions class="float-end" *ngIf="!triggerView">
  <button
    class="btn btn-primary"
    style="float: right"
    type="submit"
    (click)="onSubmit()"
  >
    Save
  </button>
</div>
