<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="page-title-box">
        <button
          class="btn btn-custom-back"
          (click)="goBack()"
          aria-label="Go back"
        >
          <i class="fas fa-chevron-left"></i>
          <span class="ms-2 d-none d-md-inline">Back</span>
        </button>
        <div class="page-title-right"></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="head-elements-position mb-3">
        <h6 class="header-title mb-0" style="color: brown">
          Pending Renwal Request
        </h6>
        <div class="app-search-box dropdown app-search">
          <div class="input-group">
            <input
              type="search"
              class="form-control"
              placeholder="Search..."
              id="top-search"
              [(ngModel)]="searchString"
              (keydown.enter)="searchResult()"
            />
            <button
              class="btn input-group-text"
              type="submit"
              (click)="searchResult()"
            >
              <i class="bi bi-search"></i>
            </button>
            <button
              class="btn input-restore"
              type="submit"
              (click)="restoreResult()"
            ></button>
          </div>
        </div>
      </div>
      <div class="d-block overflow-auto">
        <div class="table-responsive">
          <table
            mat-table
            [dataSource]="dataSource"
            class="mat-elevation-z8 demo-table"
          >
            <ng-container matColumnDef="StudentCode">
              <mat-header-cell *matHeaderCellDef class="text-dark"
                >Student Id</mat-header-cell
              >
              <mat-cell *matCellDef="let element">{{
                element.studentId
              }}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="Name">
              <mat-header-cell *matHeaderCellDef class="text-dark"
                >Name</mat-header-cell
              >
              <mat-cell *matCellDef="let element">{{
                element.userName
              }}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="catName">
              <mat-header-cell *matHeaderCellDef class="text-dark"
                >Category Name</mat-header-cell
              >
              <mat-cell *matCellDef="let element">{{
                element.ebookCatName
              }}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="bookName">
              <mat-header-cell *matHeaderCellDef class="text-dark"
                >Book Name</mat-header-cell
              >
              <mat-cell *matCellDef="let element">{{
                element.mastBookName
              }}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="publicherName">
              <mat-header-cell *matHeaderCellDef class="text-dark"
                >Author/Publisher</mat-header-cell
              >
              <mat-cell *matCellDef="let element">{{
                element.mastBookAuthPubName
              }}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="extendedDays">
              <mat-header-cell *matHeaderCellDef class="text-dark"
                >Extended Days</mat-header-cell
              >
              <mat-cell *matCellDef="let element">{{
                element.extentedDays
              }}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="approveOrRejected">
              <mat-header-cell *matHeaderCellDef class="text-dark center-cell">
                Approve/Rejected
              </mat-header-cell>

              <mat-cell *matCellDef="let element" class="center-cell">
                <a
                  [class.disabled-icon]="element.adminRenewReqStatus !== null"
                  [style.pointer-events]="
                    element.adminRenewReqStatus !== null ? 'none' : 'auto'
                  "
                  (click)="
                    element.adminRenewReqStatus === null &&
                      rejectApprove(element)
                  "
                >
                  <img src="/assets/images/appRej.png" width="30" height="30" />
                </a>
              </mat-cell>
            </ng-container>
            <mat-header-row
              *matHeaderRowDef="displayedColumns"
              class="tableHeader"
            ></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
          </table>
        </div>
      </div>
      <ngb-pagination
        [(page)]="page"
        [pageSize]="pageSize"
        [collectionSize]="collectionSize"
        [maxSize]="2"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="onPaginationClick($event)"
      >
      </ngb-pagination>
    </div>
  </div>
</div>
