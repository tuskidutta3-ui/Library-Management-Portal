<div mat-dialog-title class="d-flex shadow-sm">
  <span>Approve/Reject Request</span>
  <span class="flex-grow-1 flex-shrink-1 flex-basis-auto"></span>
  <button mat-icon-button data-dismiss="modal" mat-dialog-close>
    <mat-icon>cancel</mat-icon>
  </button>
</div>
<div mat-dialog-content data-target="#modal" class="dialog-content">
  <form [formGroup]="editrequestBooksInfo" class="mat-form-field">
    <div class="row mt-3">
      <div class="col-md-3">
        <label class="form-label" for="ebookCategorySelect"
          >Book Category:</label
        >
        <select
          class="form-select form-control-sm"
          formControlName="categoryId"
          id="ebookCategorySelect"
        >
          <option value="0">Select</option>
          <option
            *ngFor="let category of ebookCategories"
            [value]="category.catEBookId"
          >
            {{ category.ebookCatName }}
          </option>
          <option *ngIf="ebookCategories.length === 0" disabled>
            Loading...
          </option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="sailEmp"
          >Book Code<span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <input
            type="text"
            class="form-control form-control-sm"
            id="sailEmp"
            formControlName="mastBookCode"
            placeholder="Search.."
            autocomplete="off"
            (blur)="BookCodeSuggestion()"
          />
          <span
            class="input-group-text p-0 px-2"
            [ngClass]="{ disabled: triggerView }"
          >
            <a href="javascript:void(0)" (click)="BookCodeSearchBox()">
              <i class="bi bi-search fs-8"></i>
            </a>
          </span>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="empNo">Name</label>
        <input
          type="text"
          class="form-control form-control-sm"
          id="empNo"
          formControlName="mastBookName"
          placeholder="Name"
          autocomplete="off"
          readonly
        />
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-md-6">
        <label class="orm-label" for="name">Authour/Publisher</label>
        <textarea
          type="text"
          class="form-control form-control-sm"
          id="name"
          formControlName="mastBookAuthPubName"
          placeholder="Authour/Publisher"
          autocomplete="off"
          readonly
        ></textarea>
      </div>
      <div class="col-md-6">
        <label class="orm-label" for="name">Description</label>
        <textarea
          type="text"
          class="form-control form-control-sm"
          id="name"
          formControlName="mastBookDescription"
          placeholder="Description"
          autocomplete="off"
          readonly
        ></textarea>
      </div>
    </div>
    <div class="row d-flex justify-content-center mt-3">
      <div class="col-md-3">
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="Approve"
            name="rejectApproveStatus"
            value="A"
            formControlName="rejectApproveStatus"
          />
          <label class="form-check-label" for="Approve">Approve</label>
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="Reject"
            name="rejectApproveStatus"
            value="R"
            formControlName="rejectApproveStatus"
          />
          <label class="form-check-label" for="Reject">Reject</label>
        </div>
      </div>
    </div>
     <div class="row mt-3 d-flex justify-content-center " *ngIf="showCancelRemarks">
                            <!-- <div class="col-md-6"> -->
                            <!-- <div class="row"> -->
                            <label class="form-label col-md-3">
                                Rejection Remarks <span class="text-danger">*</span>
                            </label>
                            <div class="col-md-6">
                                <textarea class="form-control" rows="2" placeholder="Enter cancellation remarks"
                                    formControlName="remarks"></textarea>
                            </div>
                            <!-- </div> -->
                            <!-- </div> -->
                        </div>
  </form>
  <app-loading></app-loading
  ><!-- spinner -->
</div>
<div mat-dialog-actions class="float-end" *ngIf="!triggerView">
  <button
    class="btn btn-primary"
    style="float: right"
    type="submit"
    (click)="onSubmit()" 
  >
    Save
  </button>
</div>
