<!-- change-password.component.html -->
<button class="btn btn-custom-back mt-2" (click)="goBack()" aria-label="Go back">
    <i class="fas fa-chevron-left"></i>
    <span class="ms-2 d-none d-md-inline">Back</span>
</button> 
<div class="change-password-container">
    <div class="change-password-card">
        <h4>🔒 Change Password</h4>
        <form [formGroup]="changePasswordForm" >
            <div class="row mt-3">
                <label class="form-label" for="currentPassword"><i class="fas fa-lock"></i> Current Password</label>
                <div class="password-wrapper">
                    <input [type]="showCurrentPassword ? 'text' : 'password'" id="currentPassword"
                        formControlName="currentPassword" required>
                    <i class="toggle-icon" (click)="showCurrentPassword = !showCurrentPassword">👁️</i>
                </div>
            </div>
            <div class="row mt-3">
                <label class="form-label" for="newPassword"><i class="fas fa-key"></i> New Password</label>
                <div class="password-wrapper">
                    <input [type]="showNewPassword ? 'text' : 'password'" id="newPassword" 
                        formControlName="newPassword" required>
                    <i class="toggle-icon" (click)="showNewPassword = !showNewPassword">👁️</i>
                </div>
            </div>
            <div class="row mt-3">
                <label class="form-label" for="confirmPassword"><i class="fas fa-check"></i> Confirm Password</label>
                <div class="password-wrapper">
                    <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword"
                        formControlName="confirmPassword" required>
                    <i class="toggle-icon" (click)="showConfirmPassword = !showConfirmPassword">👁️</i>
                </div>
            </div>
            <button type="submit" (click)="onChangePassword()" class="btn-Pass" [disabled]="changePasswordForm.invalid">Update Password</button>
        </form>
    </div>
</div>
