<div class="dialog-container">
    <h2 mat-dialog-title>Image Preview</h2>
    <mat-dialog-content>
      <img [src]="data.imageUrl" alt="Preview Image" class="full-image">
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button (click)="closeDialog()">Close</button>
    </mat-dialog-actions>
  </div>
