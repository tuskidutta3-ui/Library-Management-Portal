<div mat-dialog-title class="d-flex shadow-sm">
    <span>Add New Books</span>
    <span class="flex-grow-1 flex-shrink-1 flex-basis-auto"></span>
    <button mat-icon-button data-dismiss="modal" mat-dialog-close>
        <mat-icon>cancel</mat-icon>
    </button>
</div>
<div mat-dialog-content data-target="#modal" class="dialog-content">
    <form [formGroup]="editManageNewBooksInfo" class="mat-form-field">
        <div class="row mt-3"> 
            <div class="col-md-10">
                <div class="row">
                    <label class="form-label col-md-5" for="ebookCategorySelect">Select eBook Category:</label>
                    <div class="col-md-7">
                        <select class="form-select" formControlName="catEBookId" id="ebookCategorySelect">
                            <option value='0'>Select</option>
                            <option *ngFor="let category of ebookCategories" [value]="category.catEBookId">
                                {{ category.ebookCatName }}
                            </option>
                            <option *ngIf="ebookCategories.length === 0" disabled>Loading...</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-3 d-flex justify-content-center ">
            <div class="col-md-2">
                <label class="form-label " for="code">Book Code<span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="code" formControlName="mastBookCode" placeholder="Code"
                    autocomplete="off" minlength="1" maxlength="7">
            </div>
            <div class="col-md-10">
                <label class="form-label" for="Name">Book Name<span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="code" formControlName="mastBookName" placeholder="Name"
                    autocomplete="off" minlength="1" maxlength="50">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-4 marginP">
                <label class="form-label" for="des">Author/Publications<span class="text-danger">*</span> </label>
                <textarea class="form-control" id="author" formControlName="mastBookAuthPubName"
                    placeholder="Author/Publication" autocomplete="off" maxlength="50" rows="3"></textarea>
            </div>
            <div class="col-md-8 marginP">
                <label class="form-label" for="des">Description<span class="text-danger">*</span> </label>
                <textarea class="form-control" id="desc" formControlName="mastBookDescription"
                    placeholder="About the Book" autocomplete="off" maxlength="300" rows="3"></textarea>
            </div>
        </div>
        <!-- Save Button -->
<div mat-dialog-actions class="float-end" *ngIf="!triggerView">
    <button class="btn btn-primary" style="float:right;" type="submit" (click)="onSubmit()"
        [disabled]="editManageNewBooksInfo.invalid">Save
    </button>
</div>
        <app-loading></app-loading><!-- spinner -->
    </form>
    <!-- {{editManageNewBooksInfo.value | json}} -->
</div>
