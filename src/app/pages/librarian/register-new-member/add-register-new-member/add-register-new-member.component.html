  <div mat-dialog-title class="d-flex shadow-sm">
    <span>Add New Books</span>
    <span class="flex-grow-1 flex-shrink-1 flex-basis-auto"></span>
    <button mat-icon-button data-dismiss="modal" mat-dialog-close>
      <mat-icon>cancel</mat-icon>
    </button>
  </div>
  <div mat-dialog-content data-target="#modal" class="dialog-content">
    <form [formGroup]="editManageNewBooksInfo" class="mat-form-field">
      <div class="row mt-3">
        <label class="form-label col-md-3" for="userName"
          >Member Name<span class="text-danger">*</span></label
        >
        <div class="col-md-9">
          <input
            type="text"
            class="form-control"
            id="userName"
            formControlName="userName"
            placeholder="Name"
            autocomplete="off"
            minlength="1"
            maxlength="200"
          />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-4">
          <label class="form-label" for="phoneNo"
            >Phone Number<span class="text-danger">*</span></label
          >
          <input
            type="text"
            class="form-control"
            id="phoneNo"
            formControlName="phoneNo"
            placeholder="Phone No"
            autocomplete="off"
            minlength="1"
            maxlength="10" (keypress)="numberOnly($event)"
          />
        </div>
        <div class="col-md-8">
          <label class="form-label" for="userEmail"
            >Email<span class="text-danger">*</span></label
          >
          <input
            type="email"
            class="form-control"
            id="userEmail"
            formControlName="userEmail"
            placeholder="Email"
            autocomplete="off"
            minlength="1"
            maxlength="200"
          />
        </div>
      </div>

  </div>
  <div mat-dialog-actions class="float-end" *ngIf="!triggerView">
    <button
      class="btn btn-primary"
      style="float: right"
      type="submit"
      (click)="onSubmit()"
      [disabled]="editManageNewBooksInfo.invalid"
    >
      Save
    </button>
