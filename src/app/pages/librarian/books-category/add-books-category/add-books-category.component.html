<div mat-dialog-title class="d-flex shadow-sm">
  <span>Add Category</span>
  <span class="flex-grow-1 flex-shrink-1 flex-basis-auto"></span>
  <button mat-icon-button data-dismiss="modal" mat-dialog-close>
    <mat-icon>cancel</mat-icon>
  </button>
</div>
<div mat-dialog-content data-target="#modal" class="dialog-content">
  <form [formGroup]="editManageNewBooksInfo" class="mat-form-field">
    <div class="row mt-3">
      <div class="col-md-4">
        <label class="form-label" for="code"
          >Code<span class="text-danger">*</span></label
        >
        <input
          type="text"
          class="form-control"
          id="code"
          formControlName="ebookCode"
          placeholder="Code"
          autocomplete="off"
          minlength="1"
          maxlength="3"
        />
      </div>
      <div class="col-md-8">
        <label class="form-label" for="Name"
          >Name<span class="text-danger">*</span></label
        >
        <input
          type="text"
          class="form-control"
          id="code"
          formControlName="ebookCatName"
          placeholder="Name"
          autocomplete="off"
          minlength="1"
          maxlength="50"
        />
      </div>
    </div>
    <!-- Save Button -->
    <div mat-dialog-actions class="float-end" *ngIf="!triggerView">
      <button
        class="btn btn-primary"
        style="float: right"
        type="submit"
        (click)="onSubmit()"
        [disabled]="editManageNewBooksInfo.invalid"
      >
        Save
      </button>
    </div>
    <app-loading></app-loading
    ><!-- spinner -->
  </form>
</div>
