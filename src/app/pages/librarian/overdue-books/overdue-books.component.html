<div class="container-fluid">
    <!-- start page title -->
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <button class="btn btn-custom-back" (click)="goBack()" aria-label="Go back">
                    <i class="fas fa-chevron-left"></i>
                    <span class="ms-2 d-none d-md-inline">Back</span>
                </button>
                <h4 class="page-title invisible fw-bold">CANTEEN BILL REGISTER</h4>
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                    </ol>
                </div>
            </div>
        </div>
    </div>
    <form [formGroup]="editCanteenBillRegInfo" class="mat-form-field">
        <div class="row mt-3 d-flex justify-content-center">
            <div class="col-10 col-md-6 col-xl-3">
                <div class="card custom-border">
                    <div class="card-header">
                        <h6 class="mb-0 custom-header">Overdue Management</h6>
                    </div>
                    <div class="card-body bg-light">
                        <div class="row mt-3 d-flex justify-content-center">
                            <div class="col-md-4">
                                <button type="button" class="btn view-button">
                                    <i class="fas fa-eye"></i> <span class="ms-2">View</span></button>
                            </div>
                            <div class="col-md-5">
                                <button type="button" class="btn update-button">
                                    <i class="fas fa-sync-alt"></i> <span class="ms-2">Update</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
