<h2 mat-dialog-title>Username Pattern</h2>
<mat-dialog-content>
    <p>Username must be 5-15 characters long, start with a letter, and contain only letters, numbers, or _.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="closeDialog()">Got it</button>
</mat-dialog-actions>
