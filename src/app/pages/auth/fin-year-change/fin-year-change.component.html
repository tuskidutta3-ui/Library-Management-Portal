<div class="account-pages my-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-10">
                <div class="card">
                    <div class="card-body p-0">
                        <div class="row g-0">
                            <div class="col-lg-6 p-4">
                                <div class="mx-auto text-center">
                                    <!-- <a href="index.html">
                                        <img src="assets/images/logo-dark.png" alt="" height="40"
                                            style="border: 3px solid #c4e8e9; border-radius: 6px; padding: 5px;" />
                                    </a> -->
                                </div>
                                <br>
                                <h6 class="h5 mb-0 mt-3">Financial Year Change</h6>
                                <p class="text-muted mt-1 mb-4">Select a Financial Year to move your required Financial
                                    Year</p><br>
                                <form [formGroup]="finYearChangeForm">
                                    <div class="row justify-content-center flex-column align-items-center">
                                        <div class="mb-3 col-md-3 w-100 text-center">
                                            <select class="form-select" formControlName="financialYear">
                                                <option value="">Please select financial year</option>
                                                <option *ngFor="let v of finYearListRecords"
                                                    value="{{ v.financiaL_YEAR }}">{{
                                                    v.financiaL_YEAR}}</option>
                                            </select>
                                        </div>
                                    </div>
                                    <br>
                                    <div class="mb-0 text-center">
                                        <button class="btn btn-primary w-100" type="submit"
                                            [disabled]="finYearChangeForm.invalid"
                                            (click)="finYearChangeHandler()">Change</button>
                                    </div>
                                </form>
                            </div>
                            <div class="col-lg-6 d-none d-lg-inline-block">
                                <div class="auth-page-sidebar"> <!-- Add margin-top here -->
                                    <div class="overlay"></div>
                                    <div class="auth-user-testimonial">
                                        <p class="fs-24 fw-bold text-white mb-1" style="margin-top: 30px; font-size: 16px; color: rgb(255, 255, 255) !important; 
                                        background-color: transparent; padding: 5px 5px; border-radius: 5px;
                                        border: 0px solid rgb(7, 7, 7); line-height: 1;">
                                        </p>
                                        <p class="fs-24 fw-bold text-white mb-1"
                                            style="margin-top: 16px; font-size: 16px; color: rgb(255, 255, 255) !important;">
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div> <!-- end card-body -->
                </div>
                <!-- end card -->
                <div class="row mt-3">
                    <div class="col-12 text-center">
                        <p class="text-muted">Back to <a routerLink="/app"
                                class="BackClick-btn-green fw-bold ms-1">Home</a>
                        </p>
                    </div>
                </div>
                <!-- end row -->
            </div> <!-- end col -->
        </div>
        <!-- end row -->
    </div>
    <!-- end container -->
</div>
