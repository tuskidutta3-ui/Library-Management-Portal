<div class="container">   
        <div class="forgot-password-dashboard">
            <div class="row d-flex justify-content-center">
                <div class="col-xl-8 col-lg-10 col-md-12 col-12">
                    <div class="card custom-border">
                        <div class="card-body">
                            <div class="row d-flex justify-content-center">
                                <div class="col-md-12">
                                    <!-- <div class="mx-auto text-center">
                                        <img src="/assets/images/LOGO3.png" alt="Logo" class="logo-img">
                                    </div> -->
                                    <div class="forgot-password-header">
                                        <h6 class="h5 mb-0 text-center">Forgot Password ?</h6>
                                        <span class="forgot-icon">
                                            <mat-icon class="mat-icon-lock">lock_reset</mat-icon>
                                        </span>
                                        <p class="text-muted mt-1 mb-4"><strong>
                                                Enter your email address, and we’ll send you a link with
                                                instructions to
                                                reset your password.
                                            </strong></p>
                                    </div>
                                    <form [formGroup]="forgotPassForm">
                                        <div class="mb-3">
                                            <label class="form-label d-flex justify-content-left"><strong>Email
                                                    Address</strong></label>
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <mat-icon>mail</mat-icon>
                                                </span>
                                                <input type="email" class="form-control" id="email"
                                                    placeholder="hello@forgotpassword.com" formControlName="email">
                                            </div>
                                        </div>
                                        <div class="mb-0 text-center">
                                            <!-- Submit Button with Icon -->
                                            <button class="btn btn-primary w-100" type="submit"
                                                [disabled]="forgotPassForm.invalid" (click)="forgotPassHandler()">
                                                <i class="fas fa-paper-plane"></i> <!-- Add the icon here -->
                                                Submit
                                            </button>
                                            <!-- Back to Log In Button with Icon -->
                                            <button routerLink="/app/" class="btn btn-Login mt-3 w-100">
                                                <i class="fas fa-arrow-left"></i> <!-- Add the icon here -->
                                                Back to Log In
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-12 text-center">
                                    <!-- <button routerLink="/app/" class="btn btn-primary w-50">
                                        <mat-icon class="mat-icon">login</mat-icon> 
                                        Back to Log In
                                    </button> -->
                                </div>
                                <!-- <div class="col-md-6 text-center">
                                    <button routerLink="/auth/reset-forgot-password/:token" class="btn btn-primary w-75">
                                        <mat-icon class="mat-icon">vpn_key</mat-icon> 
                                        Reset Password
                                    </button>
                                </div> -->
                            </div>
                        </div> <!-- end card-body -->
                    </div> <!-- end card -->
                </div> <!-- end col -->
            </div> <!-- end row -->
        </div> <!-- end container --> 
</div>
