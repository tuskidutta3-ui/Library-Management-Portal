<div mat-dialog-title class="d-flex shadow-sm">
    <span>Item Search</span>
</div>
<div mat-dialog-content data-target="#modal" class="dialog-content scrollable-form">
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-center align-items-center mb-3">
                <div class="app-search-box dropdown app-search">
                    <div class="input-group">
                        <input type="search" class="form-control" placeholder="Search..." id="top-search"
                            [(ngModel)]="searchString" (keydown.enter)="searchResult()">
                        <button class="btn input-group-text" type="submit" (click)="searchResult()">
                            <i class="bi bi-search"></i>
                        </button>
                        <button class="btn input-restore" type="submit" (click)="restoreResult()"></button>
                    </div>
                </div>
            </div>
            <div class="d-block overflow-auto">
                <div class="table-responsive">
                    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
                        <ng-container matColumnDef="itemCode">
                            <mat-header-cell *matHeaderCellDef class="text-dark">Item Code</mat-header-cell>
                            <mat-cell *matCellDef="let element">{{element.iteM_CODE}}</mat-cell>
                        </ng-container>
                        <ng-container matColumnDef="itemName">
                            <mat-header-cell *matHeaderCellDef class="text-dark">Item Name</mat-header-cell>
                            <mat-cell *matCellDef="let element">{{element.iteM_NAME}}</mat-cell>
                        </ng-container>
                        <ng-container matColumnDef="itemType">
                            <mat-header-cell *matHeaderCellDef class="text-dark">Item Type</mat-header-cell>
                            <mat-cell *matCellDef="let element">{{element.itemType}}</mat-cell>
                        </ng-container>
                        <ng-container matColumnDef="uomName">
                            <mat-header-cell *matHeaderCellDef class="text-dark">UOM Name</mat-header-cell>
                            <mat-cell *matCellDef="let element">{{element.uomShort}}</mat-cell>
                        </ng-container>
                        <ng-container matColumnDef="Action">
                            <mat-header-cell *matHeaderCellDef>Action</mat-header-cell>
                            <mat-cell *matCellDef="let element">
                                <button mat-menu-item (click)="selectRow(element)">
                                    <div
                                        style="display: flex; align-items: center; border: 3px solid #4CAF50; border-radius: 3px;">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                            <path d="M5 12l4 4L19 7" stroke="#4CAF50" stroke-width="2"
                                                stroke-linecap="round" />
                                        </svg>
                                    </div>
                                </button>
                            </mat-cell>
                        </ng-container>
                        <mat-header-row *matHeaderRowDef="displayedColumns" class="tableHeader"></mat-header-row>
                        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
                    </table>
                </div>
            </div>
            <ngb-pagination [(page)]="page" [pageSize]="pageSize" [collectionSize]="collectionSize" [maxSize]="2"
                [rotate]="true" [boundaryLinks]="true" [ellipses]="false" (pageChange)="onPaginationClick($event)">
            </ngb-pagination>
        </div>
    </div>
</div>
<div mat-dialog-actions class="float-end">
    <button mat-raised-button color="warn" class="btn btn-secondary" data-dismiss="modal"
        [mat-dialog-close]="false">Close</button>
</div>
