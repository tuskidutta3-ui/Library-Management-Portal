<div mat-dialog-content data-target="#modal" class="dialog-content">
    <div class="image-dialog">
        <img [src]="data.image" alt="Selected Photo" class="img-fluid">
    </div>
    <div class="row mt-1">
        <div class="col-md-12 d-flex justify-content-end">
            <button type="button" class="btn btn-danger me-3 shadow-sm" [disabled]="!data.isDeleteButtonEnabled"
                (click)="deletePhoto()">
                <i class="bi bi-trash"></i> Delete Photo
            </button>
            <button type="button" mat-dialog-close class="btn btn-outline-secondary shadow-sm">
                <i class="bi bi-x-circle"></i> Close
            </button>
        </div>
    </div>
</div>
