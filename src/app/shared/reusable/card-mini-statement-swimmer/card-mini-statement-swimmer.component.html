<div mat-dialog-title class="d-flex shadow-sm">
    <span>Card Mini Statement</span>
</div>
<div mat-dialog-content data-target="#modal" class="dialog-content scrollable-form">
    <form [formGroup]="editCardMiniInfo" class="mat-form-field">
        <div class="row mt-3">
            <div class="col-12 col-md-12 col-xl-12">
                <div class="card rounded border-2">
                    <div class="card-body bg-light">
                        <div class="row mt-3 d-flex justify-content-center">
                            <div class="col-md-12 col-xl-6">
                                <div class="row">
                                    <label for="session" class="form-label col-md-4 col-xl-4">Session</label>
                                    <div class="col-md-5 col-xl-8">
                                        <select id="session" class="form-select" formControlName="session">
                                            <option value="2020-2021">2020-2021</option>
                                            <option value="2021-2022">2021-2022</option>
                                            <option value="2022-2023">2022-2023</option>
                                            <option value="2023-2024">2023-2024</option>
                                            <option value="2024-2025">2024-2025</option>
                                            <option value="2025-2026">2025-2026</option>
                                            <option value="2026-2027">2026-2027</option>
                                            <option value="2027-2028">2027-2028</option>
                                            <option value="2028-2029">2028-2029</option>
                                            <option value="2029-2030">2029-2030</option>
                                            <option value="2030-2031">2030-2031</option>
                                            <option value="2031-2032">2031-2032</option>
                                            <option value="2032-2033">2032-2033</option>
                                            <option value="2033-2034">2033-2034</option>
                                            <option value="2034-2035">2034-2035</option>
                                            <option value="2035-2036">2035-2036</option>
                                            <option value="2036-2037">2036-2037</option>
                                            <option value="2037-2038">2037-2038</option>
                                            <option value="2038-2039">2038-2039</option>
                                            <option value="2039-2040">2039-2040</option>
                                            <option value="2040-2041">2040-2041</option>
                                            <option value="2041-2042">2041-2042</option>
                                            <option value="2042-2043">2042-2043</option>
                                            <option value="2043-2044">2043-2044</option>
                                            <option value="2044-2045">2044-2045</option>
                                            <option value="2045-2046">2045-2046</option>
                                            <option value="2046-2047">2046-2047</option>
                                            <option value="2047-2048">2047-2048</option>
                                            <option value="2048-2049">2048-2049</option>
                                            <option value="2049-2050">2049-2050</option>
                                            <option value="2050-2051">2050-2051</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6 col-xl-6">
                                <div class="row">
                                    <label class="form-label col-md-4">Start Date</label>
                                    <div class="col-md-8">
                                        <div class="input-group date" id="datepicker">
                                            <input type="text" class="form-control" id="date" placeholder="From Dt."
                                                autocomplete="off" formControlName="fromDate" ngbDatepicker
                                                #fromDtPicker="ngbDatepicker">
                                            <button class="btn btn-outline-secondary" (click)="fromDtPicker.toggle()"
                                                type="button"><i class="bi bi-calendar-fill"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 col-xl-6">
                                <div class="row">
                                    <label class="form-label col-md-4">End Date</label>
                                    <div class="col-md-8">
                                        <div class="input-group date" id="datepicker">
                                            <input type="text" class="form-control" id="date" placeholder="To Dt."
                                                autocomplete="off" formControlName="toDate" ngbDatepicker
                                                #toDtPicker="ngbDatepicker">
                                            <button class="btn btn-outline-secondary" (click)="toDtPicker.toggle()"
                                                type="button"><i class="bi bi-calendar-fill"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <mat-divider></mat-divider>
                        </div>
                        <div mat-dialog-actions class="float-end">
                            <!-- OK Button -->
                            <button mat-raised-button color="primary" class="btn btn-success me-3"
                                [mat-dialog-close]="true" (click)="print()">
                                OK
                            </button>
                            <!-- Close Button -->
                            <button mat-raised-button color="warn" class="btn btn-secondary" data-dismiss="modal"
                                [mat-dialog-close]="false">
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
